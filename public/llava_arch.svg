<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LLaVA 架构总览</title>
  <desc>输入图像经 CLIP 视觉编码器、投影层，与文本嵌入拼接后送入 Vicuna LLM 自回归生成回答。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
    .t  { font-size: 13px; fill: #2c2c2a; }
    .ts { font-size: 12px; fill: #5f5e5a; }
    .box { stroke-width: 0.5; rx: 8; }
    .arr { fill: none; stroke: #5f5e5a; stroke-width: 1.5; marker-end: url(#arrow); }
    .blue { fill: #b5d4f4; stroke: #185fa5; }
    .amber { fill: #fac775; stroke: #854f0b; }
    .gray { fill: #f1efe8; stroke: #5f5e5a; }
    .purple { fill: #cecbf6; stroke: #534ab7; }
    .green { fill: #c0dd97; stroke: #3b6d11; }
  </style>

  <!-- title -->
  <text x="340" y="30" class="th" text-anchor="middle">LLaVA 架构总览</text>
  <text x="340" y="48" class="ts" text-anchor="middle">Liu et al., NeurIPS 2023 Oral</text>

  <!-- top row -->
  <g>
    <!-- input image -->
    <rect x="40" y="70" width="90" height="85" class="box gray"/>
    <text x="85" y="100" class="th" text-anchor="middle" dominant-baseline="central">输入图像</text>
    <rect x="62" y="118" width="46" height="28" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
    <circle cx="78" cy="128" r="4" fill="#888780"/>
    <circle cx="92" cy="128" r="4" fill="#888780"/>
    <path d="M72 140 Q85 148 98 140" stroke="#888780" fill="none" stroke-width="1.5"/>
    <text x="85" y="158" class="ts" text-anchor="middle" dominant-baseline="central">224×224×3</text>
  </g>

  <!-- vision encoder -->
  <g>
    <rect x="150" y="70" width="140" height="85" class="box blue"/>
    <text x="220" y="92" class="th" text-anchor="middle" dominant-baseline="central">视觉编码器</text>
    <text x="220" y="108" class="ts" text-anchor="middle" dominant-baseline="central">CLIP ViT-L/14</text>
    <!-- patch grid -->
    <g transform="translate(187, 116)">
      <g fill="#378add" stroke="#fff" stroke-width="0.4">
        <rect x="0"  y="0"  width="6" height="6"/>
        <rect x="6"  y="0"  width="6" height="6"/>
        <rect x="12" y="0"  width="6" height="6"/>
        <rect x="18" y="0"  width="6" height="6"/>
        <rect x="0"  y="6"  width="6" height="6"/>
        <rect x="6"  y="6"  width="6" height="6"/>
        <rect x="12" y="6"  width="6" height="6"/>
        <rect x="18" y="6"  width="6" height="6"/>
        <rect x="0"  y="12" width="6" height="6"/>
        <rect x="6"  y="12" width="6" height="6"/>
        <rect x="12" y="12" width="6" height="6"/>
        <rect x="18" y="12" width="6" height="6"/>
      </g>
    </g>
    <text x="220" y="147" class="ts" text-anchor="middle" dominant-baseline="central">14×14=256 tokens</text>
  </g>

  <!-- projection -->
  <g>
    <rect x="310" y="70" width="130" height="85" class="box amber"/>
    <text x="375" y="92" class="th" text-anchor="middle" dominant-baseline="central">投影层</text>
    <text x="375" y="110" class="ts" text-anchor="middle" dominant-baseline="central">W ∈ R^{5120×1024}</text>
    <text x="375" y="128" class="ts" text-anchor="middle" dominant-baseline="central">或 2层 MLP+GELU</text>
    <text x="375" y="146" class="ts" text-anchor="middle" dominant-baseline="central">H_v ∈ R^{256×5120}</text>
  </g>

  <!-- text embedding -->
  <g>
    <rect x="460" y="70" width="130" height="85" class="box amber"/>
    <text x="525" y="92" class="th" text-anchor="middle" dominant-baseline="central">文本嵌入</text>
    <text x="525" y="110" class="ts" text-anchor="middle" dominant-baseline="central">Vicuna Token</text>
    <text x="525" y="128" class="ts" text-anchor="middle" dominant-baseline="central">Embedding</text>
    <text x="525" y="146" class="ts" text-anchor="middle" dominant-baseline="central">文本长度 T</text>
  </g>

  <!-- bottom row -->
  <!-- concat -->
  <g>
    <rect x="180" y="200" width="130" height="85" class="box purple"/>
    <text x="245" y="222" class="th" text-anchor="middle" dominant-baseline="central">拼接输入序列</text>
    <!-- token strips -->
    <g transform="translate(200, 238)">
      <rect x="0"  y="0" width="8" height="22" fill="#ef9f27"/>
      <rect x="8"  y="0" width="8" height="22" fill="#ef9f27"/>
      <rect x="16" y="0" width="8" height="22" fill="#ef9f27"/>
      <rect x="30" y="0" width="8" height="22" fill="#378add"/>
      <rect x="38" y="0" width="8" height="22" fill="#378add"/>
      <rect x="46" y="0" width="8" height="22" fill="#378add"/>
    </g>
    <text x="245" y="276" class="ts" text-anchor="middle" dominant-baseline="central">Shape (256+T, 5120)</text>
  </g>

  <!-- llm decoder -->
  <g>
    <rect x="330" y="200" width="130" height="100" class="box amber"/>
    <text x="395" y="222" class="th" text-anchor="middle" dominant-baseline="central">语言模型解码器</text>
    <text x="395" y="240" class="ts" text-anchor="middle" dominant-baseline="central">Vicuna (LLaMA)</text>
    <text x="395" y="258" class="ts" text-anchor="middle" dominant-baseline="central">Decoder-Only</text>
    <text x="395" y="276" class="ts" text-anchor="middle" dominant-baseline="central">自回归生成</text>
    <text x="395" y="294" class="ts" text-anchor="middle" dominant-baseline="central">因果注意力（含 GQA）</text>
  </g>

  <!-- response -->
  <g>
    <rect x="480" y="200" width="100" height="85" class="box green"/>
    <text x="530" y="222" class="th" text-anchor="middle" dominant-baseline="central">生成回答</text>
    <text x="530" y="244" class="ts" text-anchor="middle" dominant-baseline="central">这只狗在草地</text>
    <text x="530" y="260" class="ts" text-anchor="middle" dominant-baseline="central">上玩球，它是</text>
    <text x="530" y="276" class="ts" text-anchor="middle" dominant-baseline="central">一只金毛犬。</text>
  </g>

  <!-- arrows -->
  <line x1="130" y1="112" x2="148" y2="112" class="arr"/>
  <line x1="290" y1="112" x2="308" y2="112" class="arr"/>
  <line x1="375" y1="155" x2="270" y2="200" class="arr"/>
  <line x1="525" y1="155" x2="432" y2="200" class="arr"/>
  <line x1="310" y1="242" x2="328" y2="242" class="arr"/>
  <line x1="460" y1="242" x2="478" y2="242" class="arr"/>

  <!-- legend -->
  <g transform="translate(40, 320)">
    <rect x="0"  y="0" width="14" height="10" class="box blue"/>
    <text x="20" y="8" class="ts" dominant-baseline="central">冻结模块</text>
    <rect x="90" y="0" width="14" height="10" class="box amber"/>
    <text x="110" y="8" class="ts" dominant-baseline="central">可训练模块</text>
    <rect x="195" y="0" width="14" height="10" class="box purple"/>
    <text x="215" y="8" class="ts" dominant-baseline="central">拼接输入</text>
  </g>
</svg>
